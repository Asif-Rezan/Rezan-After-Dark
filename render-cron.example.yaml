# Example only. Do not rename to render.yaml or deploy until the complete private
# video test passes and billable cron usage is approved.
services:
  - type: cron
    name: english-fluency-daily
    runtime: docker
    schedule: "0 18 * * *"
    dockerCommand: python fluency_video.py daily
    envVars:
      - key: DAILY_ENABLED
        value: "false"
      - key: UPLOAD_ENABLED
        value: "false"
      - key: STORY_MODEL
        value: Qwen/Qwen3-4B-Instruct-2507
      - key: SAVED_RUN_ID
        sync: false # Required unique daily-<numeric ID> for each invocation
      - key: YOUTUBE_TOKEN_JSON
        sync: false
      - key: EXPECTED_CHANNEL_ID
        sync: false
      - key: DRIVE_TOKEN_JSON
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
