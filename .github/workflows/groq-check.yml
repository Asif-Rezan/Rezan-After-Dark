name: Groq authorization check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/groq-check.yml', 'groq_check.py', 'groq_client.py', 'workflow.py']
  workflow_dispatch:
permissions:
  contents: read
env:
  STORY_MODEL: openai/gpt-oss-120b
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3' 'jsonschema>=4.23,<5'
      - name: Verify real Groq structured generation without printing content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -u groq_check.py
