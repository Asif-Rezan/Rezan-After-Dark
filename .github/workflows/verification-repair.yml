name: Recover existing private English upload verification and Drive cleanup
on:
  push:
    branches: [main]
    paths: ['.github/verification-repair-request.txt']
permissions:
  contents: read
concurrency:
  group: youtube-daily-rezan-after-dark
  cancel-in-progress: false
jobs:
  verify-existing:
    outputs:
      verified: ${{ steps.verify-upload.outputs.verified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SAVED_RUN_ID: daily-42919118406
      RUN_SCOPED_CLEANUP: 'true'
      EXPECTED_CHANNEL_ID: UCwNhdtzL9XZMIAMXm81UCbw
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify existing uploaded video and serving captions without generating or inserting any video
        id: verify-upload
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -u fluency_pipeline.py verify
  cleanup-existing:
    needs: verify-existing
    if: ${{ !cancelled() && needs.verify-existing.result == 'success' && needs.verify-existing.outputs.verified == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SAVED_RUN_ID: daily-42919118406
      RUN_SCOPED_CLEANUP: 'true'
      EXPECTED_CHANNEL_ID: UCwNhdtzL9XZMIAMXm81UCbw
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Recheck private video then clean its tagged Drive media only
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -u fluency_pipeline.py cleanup
          python - <<'PY'
          from workflow import Store
          state=Store().load('runs/daily-42919118406/state.json',{})
          print('::notice title=Recovered private video::https://www.youtube.com/watch?v='+state['video_id'])
          PY
