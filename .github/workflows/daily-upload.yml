name: Daily animated English fluency lesson
on:
  push:
    branches: [main]
    paths: ['.github/workflows/private-video-trigger.txt']
  schedule:
    - cron: '0 18 * * *' # 00:00 Asia/Dhaka (following day); uploads stay private
  workflow_dispatch:
    inputs:
      cleanup_run:
        description: 'Completed daily-<run ID>: verify existing private upload and resume cleanup only'
        type: string
        default: ''
      resume_run:
        description: 'Prepared daily-<run ID>: restore completed video from Drive; upload only, no regeneration'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: youtube-daily-rezan-after-dark
  cancel-in-progress: false
env:
  SAVED_RUN_ID: ${{ inputs.cleanup_run || inputs.resume_run || format('daily-{0}', github.run_id) }}
  DAILY_ENABLED: 'true'
  RUN_SCOPED_CLEANUP: 'true'
  HF_HUB_DISABLE_XET: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  STORY_MODEL: Qwen/Qwen3-4B-Instruct-2507
jobs:
  lesson:
    if: ${{ !inputs.cleanup_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install narration and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install -r requirements.txt
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt
      - name: Install local Qwen runtime for a fresh lesson
        if: ${{ !inputs.resume_run }}
        run: pip install -r requirements-story.txt
      - name: Validate lessons, animation, recovery and existing safety checks
        run: python -m unittest -v
      - name: Verify channel and private Drive readiness
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: UCwNhdtzL9XZMIAMXm81UCbw
          REQUIRE_PUBLIC_PUBLISH: 'false'
        run: python oauth_check.py
      - name: Generate original dialogues, animate with Python, render and upload privately
        if: ${{ !inputs.resume_run }}
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: UCwNhdtzL9XZMIAMXm81UCbw
        run: python -u fluency_video.py daily
      - name: Restore completed assets and upload only
        if: ${{ inputs.resume_run != '' }}
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: UCwNhdtzL9XZMIAMXm81UCbw
        run: python -u fluency_video.py resume-upload
  cleanup:
    if: ${{ inputs.cleanup_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify existing private HD upload and clean tagged media only
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: UCwNhdtzL9XZMIAMXm81UCbw
        run: python -u daily_publish.py
